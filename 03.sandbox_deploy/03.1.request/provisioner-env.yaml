# --- 플랫폼 위치 -------------------------------------------------------------
SBX_GKE_PROJECT: gcp-sbx-gke01
GCP_REGION: asia-northeast3
GKE_CLUSTER_NAME: gke-sbx-main-an3
# GKE 접속: internal = 컨트롤 플레인 사설 IP (10.253.3.2) · dns = DNS 엔드포인트 (Pool 이 인터넷으로 나가면 외부 허용 필요)
GKE_ENDPOINT_MODE: internal
WORKER_POOL: projects/gcp-sbx-gke01/locations/asia-northeast3/workerPools/pool-sbxtest01
REQUEST_BUCKET: gcp-sbx-gke01-sbxtest01-requests
BUNDLE_BUCKET: gcp-sbx-gke01-sbxtest01-bundles
RUNNER_IMAGE_REPO: asia-northeast3-docker.pkg.dev/gcp-prod-edp-edge-509423/ar-sbxtest01-platform/sbxtest01-automation-runner
TF_MANAGER_SA: tf-manager
# Infrastructure Manager 배포 이름 접두사: <접두사>-<과제>-<해시>-<단계>
DEPLOYMENT_PREFIX: sbxtest01
TF_VERSION_CONSTRAINT: "1.5.7"
GITHUB_REPOSITORY: sonmap/GCP_SBX_Test03
# --- 공유 ALB (1차 구축에서 한 번 생성) ---------------------------------------
SHARED_URL_MAP_NAME: urlmap-alb-sbxtest01-shared
SHARED_HEALTH_CHECK_NAME: hc-sbxtest01-jupyter-tcp
# --- 이름·허용 규칙 (환경마다 다른 값) -----------------------------------------
# sonmap.net Workspace 고객 ID. 명령서 1-8 끝에서 조회한 값과 같아야 합니다.
CLOUD_IDENTITY_CUSTOMER_ID: C03rw3vtp
GROUP_EMAIL_TEMPLATE: "pgrp-gcp-dev-{task}@sonmap.net"
MEMBER_EMAIL_DOMAINS: sonmap.net
NAMESPACE_TEMPLATE: "sbx-{area}-{task}"
ALLOWED_AREAS: general,sa,com
JUPYTER_HOST_SUFFIXES: .sonmap.net
IMAGE_REGISTRY_PREFIXES: asia-northeast3-docker.pkg.dev/gcp-prod-edp-edge-509423/
DATALAKE_PROJECTS: pjt-c-admin
MAX_MEMORY_PER_CPU: "8"
# --- JupyterHub 설정 템플릿에 들어가는 값 (hub_config=MANAGED 일 때만 사용) -----
# 로그인 방식. dummy = 로그인 서버(Okta) 연동을 끄고 아무 이름으로나 접속 (테스트 전용,
# Secret Manager 불필요). 실제 연동 시 oauth 로 바꾸고 HUB_OAUTH_BASE_URL 을 채운다.
HUB_AUTH_MODE: dummy
HUB_OAUTH_BASE_URL: https://accounts.example.invalid/oauth2/v1
PORTAL_MEMBERS_API: ""
HUB_ADMIN_USERS: ""
# Workload Identity 바인딩을 다른 계정으로 수행할 때만 지정 (비우면 tf-manager)
WI_IMPERSONATE_SA: ""
